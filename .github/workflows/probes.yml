name: Adversarial probes (gate)

# Every probe must HOLD. A probe that is EXPOSED, or INCONCLUSIVE because
# its hook never fired, fails the build, so no change can quietly reopen a
# closed attack. Also runs the evidence tests and the original attack suite.

on:
  push:
    branches: [main]
  workflow_dispatch:

defaults:
  run:
    # bash named explicitly runs every step with -eo pipefail, so a piped step
    # fails when any command in it fails (see darm-monitor 0e14b75)
    shell: bash

jobs:
  probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install darm-guard and the pinned kernel
        run: |
          pip install -e .
          darm-guard-install-kernel

      - name: Demo fixture
        run: ./tests/setup_demo.sh

      - name: Evidence tests
        run: python tests/evidence_attacks.py

      - name: Original broker attacks
        run: |
          darm-broker --config /tmp/darmdemo/config.json --registry /tmp/darmdemo/registry.txt \
            --audit /tmp/darmdemo/ci.jsonl > /tmp/broker.log 2>&1 &
          sleep 3
          python tests/broker_attacks.py

      - name: Adversarial probes (all must hold)
        run: python tests/adversarial_probes.py

      - name: R23 runtime correspondence (sampled)
        run: |
          ./tests/setup_demo.sh
          python tests/r23_correspondence.py

      - name: R23 correspondence across a crash
        run: |
          ./tests/setup_demo.sh
          python tests/r23_crash.py

      - name: R23 correspondence under conflicts
        run: |
          ./tests/setup_demo.sh
          python tests/r23_conflict.py

      - name: verify_world with a typed log (B8)
        run: |
          ./tests/setup_demo.sh
          python tests/delete_typed_log.py

      - name: delete_file against its predictions
        run: |
          ./tests/setup_demo.sh
          python tests/delete_tool.py

      - name: B8 runtime correspondence (writes and deletes)
        run: |
          ./tests/setup_demo.sh
          python tests/b8_correspondence.py

      - name: rename_file, live protocol, against its predictions
        run: |
          ./tests/setup_demo.sh
          python tests/rename_tool.py

      - name: rename_file, crash recovery at every phase
        run: |
          ./tests/setup_demo.sh
          python tests/rename_crash.py

      - name: rename_file, recovery edge cases (B9, all or nothing)
        run: |
          ./tests/setup_demo.sh
          python tests/rename_recovery_edges.py

      - name: rename_file, recovery's own crash window, and self-renames
        run: |
          ./tests/setup_demo.sh
          python tests/rename_recovery_window.py

      - name: Attestation v2 (Ed25519 key ring), on its own
        run: python tests/attest_ring.py

      - name: Attestation v2 inside the broker (auditor, legacy, unknown key, migration)
        run: |
          ./tests/setup_demo.sh
          python tests/attest_broker.py

      - name: Attestation stage 4 (re-attestation without laundering, retiring the old secret, rotation)
        run: |
          ./tests/setup_demo.sh
          python tests/attest_stage4.py

      - name: External audit checkpoints (signed chain heads)
        run: |
          ./tests/setup_demo.sh
          python tests/checkpoint_test.py

      - name: The broker publishes checkpoints (interval, startup, failure, SIGTERM)
        run: |
          ./tests/setup_demo.sh
          python tests/checkpoint_broker.py

      - name: Fail closed without a signing key; rename rolls back if signing fails
        run: |
          ./tests/setup_demo.sh
          python tests/key_failclosed.py

      - name: P14 repeated argument names refused (decided and executed cannot diverge)
        run: |
          ./tests/setup_demo.sh
          python tests/duplicate_args.py

      - name: E24 intent attacks against a running broker (previously manual)
        run: tests/run_intent_attacks.sh

      - name: Per-resource intents (E24b correspondence)
        run: |
          ./tests/setup_demo.sh
          python tests/intents_resource.py

      - name: In-flight revocation (E24c)
        run: |
          ./tests/setup_demo.sh
          python tests/revocation.py

      - name: E24d completeness, three cases (A reproduces P15; B pinned; C joint with deny-by-default)
        run: python tests/completeness_three_case.py

      - name: Known findings, as recorded (P15a HOLD, premises; P15b EXPOSED by theorem; P16 HOLD, three-state consumption); a flip fails the gate
        run: python tests/known_exposed.py

      - name: A refused path is described by its actual cause
        run: |
          ./tests/setup_demo.sh
          python tests/path_diagnosis.py

      - name: Three-state consumption (E24d Part 4); closes P16
        run: |
          ./tests/setup_demo.sh
          python tests/three_state.py

      - name: Content pinned by digest (content_sha256)
        run: |
          ./tests/setup_demo.sh
          python tests/content_hash.py

      - name: Premise-bound intents (E24d Part 3); closes P15a
        run: |
          ./tests/setup_demo.sh
          python tests/premise.py

      - name: Assurance graph (every claim cites existing theorems, gated tests, and a limitation)
        run: python scripts/check_assurance.py

      - name: One refusal per dimension, each asserting its exact failure class
        run: |
          ./tests/setup_demo.sh
          python tests/kernel_dimensions.py

      - name: darm-verify's default scenarios are pinned (earlier comparisons stay reproducible)
        run: python tests/verify_scenarios_pinned.py

      - name: Coverage map (kernel covers every dimension; allow_all covers none; every case self-checked)
        run: python tests/coverage_map.py

      - name: A file moved outside the broker is caught by the attestation's signed path, not only by the log
        run: |
          ./tests/setup_demo.sh
          python tests/moved_attestation.py

      - name: A file replayed after the broker deleted it is caught by the log, not by the attestation
        run: |
          ./tests/setup_demo.sh
          python tests/replayed_file.py

      - name: Each request identifier belongs to one invocation, and attested state leads back to it (E28's request link)
        run: |
          ./tests/setup_demo.sh
          python tests/request_link.py

      - name: A rename only moves content the broker wrote (no laundering of foreign content)
        run: |
          ./tests/setup_demo.sh
          python tests/rename_laundering.py

      - name: A renamed file's attestation leads back, through the rename, to the write that authorized its content (E30)
        run: |
          ./tests/setup_demo.sh
          python tests/rename_lineage.py

      - name: A read is attributed only if its content matches its attestation (E33, P17)
        run: |
          ./tests/setup_demo.sh
          python tests/p17_tampered_read.py

      - name: A read is attributed only if it is current (a restored file is refused; the log binds freshness)
        run: |
          ./tests/setup_demo.sh
          python tests/read_freshness.py

      - name: The broker decodes the kernel's replies exactly as K5's pyAdmits (the real kernel included)
        run: |
          ./tests/setup_demo.sh
          python tests/kernel_wire_contract.py

      - name: Every claim states its bridge from model to implementation (construction, proved, tested, assumed), counted
        run: python scripts/check_bridges.py

      - name: Every path-valued argument is in normal form before the decision (a rename's destination included)
        run: |
          ./tests/setup_demo.sh
          python tests/destination_normal_form.py

      - name: A broker stopped by SIGTERM at any moment after start ends with stop and a final checkpoint
        run: |
          ./tests/setup_demo.sh
          python tests/sigterm_window.py

      - name: The broker's normal form is K6's normalPath, exhaustively, against the real kernel
        run: |
          ./tests/setup_demo.sh
          python tests/normal_form_mirror.py

      - name: The broker executes the kernel's invocation and refuses when its own canonicalization disagrees
        run: |
          ./tests/setup_demo.sh
          python tests/canonical_agreement.py

      - name: Every effect site is classified (closed, continuation, exception); none is open
        run: |
          python scripts/check_effect_sites.py

      - name: Recovery never rolls forward a rename K6 did not admit (a forged prepared record is rolled back)
        run: |
          ./tests/setup_demo.sh
          python tests/recovery_forgery.py

      - name: A kernel reply answers only the request carrying its nonce (a stale or foreign reply is refused; K7)
        run: |
          ./tests/setup_demo.sh
          python tests/kernel_reply_binding.py

      - name: The effect-surface gate rejects unreviewed changes (eleven attacks rejected, two controls pass)
        run: python tests/gate_attacks.py

      - name: The README's evidence table matches the repository
        run: python scripts/readme_figures.py --check
