name: Adversarial probes (gate)

# Every probe must HOLD. A probe that is EXPOSED, or INCONCLUSIVE because
# its hook never fired, fails the build, so no change can quietly reopen a
# closed attack. Also runs the evidence tests and the original attack suite.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install darm-guard and the pinned kernel
        run: |
          pip install -e .
          darm-guard-install-kernel

      - name: Demo fixture
        run: ./tests/setup_demo.sh

      - name: Evidence tests
        run: python tests/evidence_attacks.py

      - name: Original broker attacks
        run: |
          darm-broker --config /tmp/darmdemo/config.json --registry /tmp/darmdemo/registry.txt \
            --audit /tmp/darmdemo/ci.jsonl > /tmp/broker.log 2>&1 &
          sleep 3
          python tests/broker_attacks.py

      - name: Adversarial probes (all must hold)
        run: python tests/adversarial_probes.py

      - name: R23 runtime correspondence (sampled)
        run: |
          ./tests/setup_demo.sh
          python tests/r23_correspondence.py

      - name: R23 correspondence across a crash
        run: |
          ./tests/setup_demo.sh
          python tests/r23_crash.py

      - name: R23 correspondence under conflicts
        run: |
          ./tests/setup_demo.sh
          python tests/r23_conflict.py

      - name: verify_world with a typed log (B8)
        run: |
          ./tests/setup_demo.sh
          python tests/delete_typed_log.py

      - name: delete_file against its predictions
        run: |
          ./tests/setup_demo.sh
          python tests/delete_tool.py

      - name: B8 runtime correspondence (writes and deletes)
        run: |
          ./tests/setup_demo.sh
          python tests/b8_correspondence.py

      - name: rename_file, live protocol, against its predictions
        run: |
          ./tests/setup_demo.sh
          python tests/rename_tool.py

      - name: rename_file, crash recovery at every phase
        run: |
          ./tests/setup_demo.sh
          python tests/rename_crash.py

      - name: rename_file, recovery edge cases (B9, all or nothing)
        run: |
          ./tests/setup_demo.sh
          python tests/rename_recovery_edges.py

      - name: rename_file, recovery's own crash window, and self-renames
        run: |
          ./tests/setup_demo.sh
          python tests/rename_recovery_window.py

      - name: Attestation v2 (Ed25519 key ring), on its own
        run: python tests/attest_ring.py

      - name: Attestation v2 inside the broker (auditor, legacy, unknown key, migration)
        run: |
          ./tests/setup_demo.sh
          python tests/attest_broker.py
