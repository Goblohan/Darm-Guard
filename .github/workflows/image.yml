name: Container image

# On each release tag: build the image the deployment uses, run the demo inside it, and only
# then publish it to GitHub's container registry as ghcr.io/goblohan/darm-guard.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

defaults:
  run:
    shell: bash

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the image, the same one the deployment uses
        run: docker build -f deploy/broker.Dockerfile -t darm-guard:candidate .

      - name: The demo runs inside it, every step as described
        run: docker run --rm darm-guard:candidate darm-guard demo

      - name: Publish it, tagged with the release and as latest
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          img=ghcr.io/goblohan/darm-guard
          ver="${GITHUB_REF_NAME#v}"
          docker tag darm-guard:candidate "$img:$ver"
          docker tag darm-guard:candidate "$img:latest"
          docker push "$img:$ver"
          docker push "$img:latest"
