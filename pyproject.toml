[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "darm-guard"
version = "0.7.0"
description = "Agent tool-authorization guard grounded in a machine-checked Lean 4 theory"
authors = [{name = "Olusanya Gbolahan V"}]
requires-python = ">=3.9"
license = "MIT"
readme = "README.md"
keywords = ["ai-safety", "agent-governance", "formal-verification"]

[project.urls]
"Formal Backing" = "https://github.com/Goblohan/darm-monitor"
"Source" = "https://github.com/Goblohan/Darm-Guard"

[tool.setuptools.packages.find]
include = ["darm_guard*"]

[project.scripts]
darm-guard-install-kernel = "darm_guard.install:main"
darm-verify = "darm_guard.verify:main"
darm-broker = "darm_guard.broker:main"
