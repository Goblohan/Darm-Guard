[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "darm-guard"
version = "0.25.0"
dependencies = ["cryptography>=42"]
description = "Runtime authorization for AI agents, decided by a kernel compiled from a machine-checked Lean 4 model"
authors = [{name = "Olusanya Gbolahan V"}]
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
readme = "README.md"
keywords = ["ai-safety", "agent-governance", "formal-verification"]

[project.urls]
"Formal Backing" = "https://github.com/Goblohan/darm-monitor"
"Source" = "https://github.com/Goblohan/Darm-Guard"

[tool.setuptools.packages.find]
include = ["darm_guard*"]

[project.scripts]
darm-guard = "darm_guard.cli:main"
darm-guard-install-kernel = "darm_guard.install:main"
darm-verify = "darm_guard.verify:main"
darm-broker = "darm_guard.broker:main"
darm-coverage = "darm_guard.coverage:main"
