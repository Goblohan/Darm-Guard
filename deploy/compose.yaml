# The broker and the agent, each in its own container. The agent has no network, a read-only
# filesystem, no workspace and no darm-guard: its only channel is the broker's socket.
#   docker compose -f deploy/compose.yaml up --build --abort-on-container-exit --exit-code-from agent
name: darm-guard-mediation
services:
  broker:
    build:
      context: ..
      dockerfile: deploy/broker.Dockerfile
    platform: linux/amd64          # the kernel binary is linux x86_64; Docker emulates it elsewhere
    volumes:
      - sock:/sock
  agent:
    image: python:3.12-slim
    depends_on:
      broker:
        condition: service_healthy
    network_mode: none
    read_only: true
    user: "1000:1000"
    volumes:
      - sock:/sock
      - ./agent.py:/agent.py:ro
    command: ["python", "/agent.py"]
volumes:
  sock: {}
