<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>DARM Guard</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:sans-serif;background:#0a0a0f;color:#e0e0e8;padding:24px}h1{font-size:20px;margin-bottom:4px}.sub{color:#888;font-size:13px;margin-bottom:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}.card{background:#14141c;border:1px solid #2a2a3a;border-radius:8px;padding:16px}.card h2{font-size:14px;color:#888;text-transform:uppercase;margin-bottom:12px}.stat{font-size:32px;font-weight:700}.green{color:#4ade80}.red{color:#f87171}.scope-list{list-style:none}.scope-list li{padding:6px 10px;margin:4px 0;border-radius:4px;font-size:13px;font-family:monospace}.within{background:#0d2818;border:1px solid #166534;color:#4ade80}.drift{background:#2d1f0e;border:1px solid #854d0e;color:#fbbf24}.violation{background:#2d0e0e;border:1px solid #991b1b;color:#f87171}.unused{background:#1a1a2a;border:1px solid #2a2a3a;color:#555}.log{max-height:320px;overflow-y:auto}.log-entry{padding:8px 12px;margin:4px 0;border-radius:4px;font-size:12px;font-family:monospace}.log-entry.admitted{background:#0d2818;border-left:3px solid #4ade80}.log-entry.rejected{background:#2d0e0e;border-left:3px solid #f87171}.time{color:#666}.tools{color:#93c5fd}.failure{color:#fca5a5}.full{grid-column:1/-1}.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600;text-transform:uppercase}.badge.observe{background:#1e3a5f;color:#60a5fa}.badge.govern{background:#3b2f0a;color:#fbbf24}.badge.enforce{background:#3b0a0a;color:#f87171}</style></head><body><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px"><div><h1>DARM Guard</h1><div class="sub">formally verified agent governance</div></div><span id="mode" class="badge observe">OBSERVE </span></div><div class="grid"><div class="card"><h2>Calls</h2><div id="calls" class="stat green">0</div></div><div class="card"><h2>Violations</h2><div id="viols" class="stat green">0</div></div></div><div class="grid"><div class="card"><h2>Scope Map</h2><ul id="scope" class="scope-list"><li class="unused">waiting</li></ul></div><div class="card"><h2>Session</h2><div style="margin:4px 0;font-size:12px"><span style="color:#888">Credential:</span> <span id="cred" style="font-family:monospace;color:#4ade80"></span></div><div style="margin:4px 0;font-size:12px"><span style="color:#888">Cumulative:</span> <span id="cum" style="font-family:monospace;color:#93c5fd"></span></div><div style="margin:4px 0;font-size:12px"><span style="color:#888">Delta:</span> <span id="dlt" style="font-family:monospace;color:#fbbf24"></span></div></div></div><div class="grid"><div class="card full"><h2>Audit Log</h2><div id="log" class="log"><div class="log-entry admitted">waiting</div></div></div></div><script>async function R(){try{const r=await fetch("/api/state");if(!r.ok)return;const d=await r.json();document.getElementById("calls").textContent=d.scope.call_count;const v=d.scope.violations;const ve=document.getElementById("viols");ve.textContent=v;ve.className="stat "+(v===0?"green":"red");document.getElementById("mode").textContent=d.mode;document.getElementById("mode").className="badge "+d.mode.toLowerCase();document.getElementById("cred").textContent=d.scope.credential_scope.join(", ")||"none";document.getElementById("cum").textContent=d.scope.cumulative_scope.join(", ")||"none";document.getElementById("dlt").textContent=d.scope.delta.join(", ")||"none";const sm=document.getElementById("scope");const at=new Set([...d.scope.credential_scope,...d.scope.cumulative_scope,...(d.policy_tools||[])]);if(at.size===0){sm.innerHTML='<li class="unused">no tools</li>';}else{sm.innerHTML="";for(const t of[...at].sort()){const li=document.createElement("li");li.textContent=t;if(d.scope.credential_scope.includes(t)){li.className="within";li.textContent+=" (credential)";}else if(d.scope.delta.includes(t)){const isV=d.audit.some(e=>e.requested.includes(t)&&!e.admitted);li.className=isV?"violation":"drift";li.textContent+=isV?" (VIOLATION)":" (drift)";}else{li.className="unused";li.textContent+=" (available)";}sm.appendChild(li);}}const lg=document.getElementById("log");if(d.audit.length===0){lg.innerHTML='<div class="log-entry admitted">waiting</div>';}else{lg.innerHTML="";for(const e of d.audit.slice().reverse()){const div=document.createElement("div");div.className="log-entry "+(e.admitted?"admitted":"rejected");let tx=e.timestamp.split("T")[1].split(".")[0]+" "+e.requested.join(", ")+" "+(e.admitted?"admitted":"REJECTED");if(e.drift!=="WITHIN")tx+=" ["+e.drift+"]";for(const f of e.failures)tx+=" "+f.kind+": "+f.detail;div.innerHTML=tx;lg.appendChild(div);}}}catch(e){}}setInterval(R,1000);R();</script></body></html>
